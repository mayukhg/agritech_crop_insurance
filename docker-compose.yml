services:
  postgres:
    image: postgres:16-alpine
    container_name: cropguard-pg
    environment:
      POSTGRES_USER: cropguard
      POSTGRES_PASSWORD: cropguard
      POSTGRES_DB: cropguard
    ports:
      - "5434:5432"
    volumes:
      - cropguard_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cropguard -d cropguard"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cropguard_pg_data:
